<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản dịch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <header class="titlebar">
      <div class="traffic-lights">
        <button id="closeButton" class="traffic close" type="button" title="Đóng"></button>
        <span class="traffic minimize" aria-hidden="true"></span>
        <span class="traffic zoom" aria-hidden="true"></span>
      </div>
      <div class="titlebar-center">
        <div class="brand"><img src="../assets/icon128.png" alt=""><strong id="resultTitle">Dịch màn hình</strong></div>
        <div class="lang-selector-wrap">
          <button id="langBadge" class="header-badge lang-badge interactive" type="button" aria-haspopup="listbox" aria-expanded="false" title="Bấm để đổi ngôn ngữ dịch cho phiên này">
            <span id="langBadgeText">Tự động → Tiếng Việt</span>
            <svg class="badge-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="langDropdown" class="lang-dropdown-menu" hidden>
            <div class="lang-dropdown-header">
              <span>Đổi ngôn ngữ đích (chỉ phiên này)</span>
            </div>
            <div class="lang-dropdown-search">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="langSearchInput" type="text" placeholder="Tìm ngôn ngữ…" autocomplete="off" spellcheck="false" />
            </div>
            <div id="langList" class="lang-dropdown-list" role="listbox"></div>
          </div>
        </div>
        <div id="ocrBadge" class="header-badge ocr-badge" title="Chi tiết OCR" hidden>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span id="ocrBadgeText">Auto OCR</span>
        </div>
      </div>
      <div class="titlebar-actions">
        <button id="openMainButton" class="settings-button" type="button" title="Mở InputBridge">⚙</button>
      </div>
    </header>

    <div id="loading" class="loading-row">
      <i></i><span id="loadingText">Đang nhận dạng chữ…</span>
    </div>

    <img id="preview" class="preview" alt="Vùng vừa chụp" hidden>

    <section id="layoutBlock" class="layout-result" hidden>
      <div class="workspace-toolbar">
        <div class="mode-control" role="tablist" aria-label="Công cụ tương tác">
          <button id="selectTextButton" class="active" type="button" role="tab" aria-selected="true" title="Bôi đen và sao chép chữ (V)">
            <svg class="tab-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
            <span class="tab-label">Chọn</span>
          </button>
          <button id="cropButton" type="button" role="tab" aria-selected="false" title="Cắt & Dịch tập trung vùng con (C)">
            <svg class="tab-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
            <span class="tab-label">Cắt</span>
          </button>
          <button id="drawButton" type="button" role="tab" aria-selected="false" title="Vẽ lên ảnh (P)">
            <svg class="tab-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            <span class="tab-label">Vẽ</span>
          </button>
          <button id="eraseButton" type="button" role="tab" aria-selected="false" title="Tẩy nét vẽ (E)">
            <svg class="tab-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/></svg>
            <span class="tab-label">Tẩy</span>
          </button>
        </div>
        <button id="clearDrawingButton" class="quiet-action icon-btn" type="button" title="Xóa toàn bộ nét vẽ" disabled>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <div class="toolbar-spacer"></div>
        <div class="zoom-controls" aria-label="Điều khiển zoom">
          <button id="fitWidthButton" type="button" title="Khớp chiều ngang để đọc (Fit Width)">↔</button>
          <button id="fitPageButton" type="button" title="Khớp toàn bộ ảnh vào khung (Fit Page)">⤢</button>
          <button id="zoomOutButton" type="button" title="Thu nhỏ">−</button>
          <button id="zoomResetButton" type="button" title="Kích thước 100%">100%</button>
          <button id="zoomInButton" type="button" title="Phóng to">+</button>
        </div>
        <button id="compareToggleButton" class="action-btn" type="button" title="Xem ảnh gốc / Bản dịch">
          <svg class="btn-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span id="compareToggleText" class="btn-label">Ảnh gốc</span>
        </button>
        <button id="speakButton" class="action-btn" type="button" title="Nghe đọc bản dịch bằng giọng Edge TTS">
          <svg class="btn-icon speak-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <span class="btn-label">Nghe đọc</span>
        </button>
        <button id="recaptureButton" class="action-btn" type="button" title="Chụp lại vùng khác">
          <svg class="btn-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span class="btn-label">Chụp lại</span>
        </button>
        <button id="copyImageButton" class="action-btn primary" type="button" title="Sao chép ảnh vào clipboard">
          <svg class="btn-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span class="btn-label primary-label">Sao chép</span>
        </button>
      </div>
      <div id="readingBar" class="reading-bar" hidden>
        <div class="reading-pill">
          <div class="reading-wave">
            <span></span><span></span><span></span>
          </div>
          <span id="readingIndex" class="reading-index">1/5</span>
          <span id="readingText" class="reading-text">Đang đọc…</span>
        </div>
        <div class="reading-actions">
          <button id="prevSpeechBtn" class="reading-action-btn" type="button" title="Câu trước">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="3"/></svg>
          </button>
          <button id="pauseSpeechBtn" class="reading-action-btn" type="button" title="Tạm dừng / Tiếp tục">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button id="nextSpeechBtn" class="reading-action-btn" type="button" title="Câu tiếp theo">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="3"/></svg>
          </button>
          <button id="stopSpeechBtn" class="reading-action-btn stop" type="button" title="Dừng đọc">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="canvasWrap" class="canvas-wrap mode-select">
        <div id="canvasStage" class="canvas-stage">
          <canvas id="originalCanvas" class="original-canvas"></canvas>
          <div id="translatedLayer" class="translated-layer">
            <canvas id="layoutCanvas"></canvas>
            <div id="textLayer" class="text-layer" aria-label="Chữ đã dịch có thể bôi đen"></div>
          </div>
          <div id="readingHighlight" class="reading-highlight" hidden></div>
          <canvas id="drawingCanvas" class="drawing-canvas"></canvas>
          <div id="cropOverlay" class="crop-overlay" hidden>
            <div id="cropBox" class="crop-box" hidden>
              <div class="crop-dim-badge"><span id="cropDimText">0 × 0</span></div>
              <div class="crop-actions-hud" id="cropActionsHud">
                <button id="cropTranslateBtn" type="button" class="hud-btn primary" title="Dịch tập trung riêng vùng này">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                  <span>Dịch vùng này</span>
                </button>
                <button id="cropCopyBtn" type="button" class="hud-btn" title="Sao chép ảnh vùng chọn">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                  <span>Sao chép</span>
                </button>
                <button id="cropCancelBtn" type="button" class="hud-btn close" title="Hủy chọn (Esc)">✕</button>
              </div>
            </div>
          </div>
          <button id="compareHandle" class="compare-handle" type="button" role="slider" aria-label="Kéo để so sánh ảnh gốc và ảnh đã dịch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
            <div class="compare-knob">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m8 6-6 6 6 6M16 6l6 6-6 6"/>
              </svg>
            </div>
            <div class="compare-tags">
              <span class="compare-tag origin">Gốc</span>
              <span class="compare-tag trans">Dịch</span>
            </div>
          </button>
        </div>
      </div>
    </section>

    <section id="originalBlock" class="text-block original" hidden>
      <div class="label-row"><span>Văn bản gốc</span></div>
      <p id="originalText"></p>
    </section>

    <section id="translationBlock" class="text-block translation" hidden>
      <div class="label-row">
        <span>Bản dịch</span>
        <div class="block-actions">
          <button id="speakTextButton" class="quiet-btn" type="button">Nghe đọc</button>
          <button id="copyButton" class="quiet-btn" type="button">Sao chép</button>
          <button id="recaptureTextButton" class="quiet-btn" type="button">Chụp lại</button>
        </div>
      </div>
      <p id="translationText"></p>
    </section>

    <section id="errorBlock" class="error-block" hidden>
      <strong>Không dịch được</strong>
      <p id="errorText"></p>
    </section>
  </main>
  <div id="selectionToolbar" class="selection-toolbar" role="toolbar" aria-label="Thao tác với chữ đã chọn" hidden>
    <button id="translateSelectionButton" type="button" data-tooltip="Dịch riêng chữ đã chọn" aria-label="Dịch riêng cụm chữ đã chọn">
      <svg class="btn-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
      </svg>
      <strong>Dịch</strong>
    </button>
    <button id="copySelectionButton" type="button" data-tooltip="Sao chép bằng Ctrl+C" aria-label="Sao chép chữ đã chọn. Phím tắt Ctrl+C">
      <svg class="btn-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <strong>Sao chép</strong>
    </button>
    <div id="subTranslatePopover" class="sub-translate-popover" hidden>
      <div class="sub-trans-header">
        <div class="sub-trans-picker-group">
          <span class="sub-trans-picker-label">Dịch sang:</span>
          <select id="subTransLangSelect" class="sub-trans-select" title="Chọn ngôn ngữ đích cho cụm này"></select>
        </div>
        <button id="subTransClose" type="button" class="sub-trans-close" title="Đóng">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="subTransOrigRow" class="sub-trans-orig-row" hidden>
        <span class="sub-trans-tag">Gốc:</span>
        <span id="subTransOrigText" class="sub-trans-orig-text"></span>
      </div>
      <div id="subTransBody" class="sub-trans-body">Đang dịch…</div>
      <div class="sub-trans-footer">
        <button id="subTransCopy" type="button" class="sub-trans-btn" title="Sao chép bản dịch">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span>Sao chép</span>
        </button>
        <button id="subTransSpeak" type="button" class="sub-trans-btn" title="Nghe phát âm">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          <span>Nghe đọc</span>
        </button>
      </div>
    </div>
  </div>
  <script src="result.js"></script>
</body>
</html>
