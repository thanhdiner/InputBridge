<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>InputBridge Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #e5e7eb;
        background: #0f172a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(760px, calc(100vw - 32px));
      }
      h1 { margin: 0 0 8px; }
      p { color: #94a3b8; }
      textarea,
      [contenteditable] {
        width: 100%;
        min-height: 120px;
        margin-top: 14px;
        padding: 16px;
        color: #f8fafc;
        background: #111827;
        border: 1px solid #334155;
        border-radius: 18px;
        outline: none;
        font: 500 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      [contenteditable] { min-height: 90px; }
      button {
        margin-top: 12px;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        color: white;
        background: #8b5cf6;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>InputBridge Demo</h1>
      <p>Load unpacked extension, bật “Allow access to file URLs” nếu muốn test trực tiếp file này. Gõ vào ô dưới, ngừng 1 nhịp để thấy preview.</p>

      <textarea placeholder="Ví dụ: mai tôi hơi bận để tôi xem lại rồi báo bạn"></textarea>

      <div contenteditable="true" role="textbox" aria-label="Demo rich editor">Gõ thử ở contenteditable này nữa.</div>

      <button type="button">Fake Send</button>
    </main>
  </body>
</html>
